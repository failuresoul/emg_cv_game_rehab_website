# Development: docker compose up --build
name: motionlab

services:
  server:
    build: ./server
    env_file: server/.env
    environment:
      DATABASE_URL: sqlite:////data/motionlab.db
      GAME_SPECS_PATH: /shared/game-specs.json
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./server/app:/app/app
      - ./data:/data
      # The game settings exported by the web app (npm run export:specs).
      - ./shared:/shared:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      target: dev
    environment:
      VITE_API_TARGET: http://server:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy
