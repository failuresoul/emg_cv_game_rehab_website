# Production-like: docker compose -f docker-compose.prod.yml up --build -d
name: motionlab-prod

services:
  server:
    build: ./server
    env_file: server/.env
    environment:
      DATABASE_URL: sqlite:////data/motionlab.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: prod
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
